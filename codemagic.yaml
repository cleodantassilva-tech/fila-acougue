workflows:
  fila-acougue-android:
    name: Fila Açougue - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Gerar pasta android se nao existir
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name fila_acougue --org com.acougue
          fi
      - name: Adicionar permissoes de contatos e microfone
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$MANIFEST"; then
            awk '/<manifest/{print; print "    <uses-permission android:name=\"android.permission.INTERNET\"/>"; print "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"; print "    <uses-permission android:name=\"android.permission.READ_CONTACTS\"/>"; next}1' "$MANIFEST" > /tmp/manifest_novo.xml
            mv /tmp/manifest_novo.xml "$MANIFEST"
          fi
      - name: Instalar dependencias
        script: flutter pub get
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
