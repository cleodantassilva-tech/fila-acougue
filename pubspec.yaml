name: fila_acougue
description: App de fila de encomendas do açougue (WebView com pontes nativas de contatos e voz)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_contacts: ^2.3.1
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/pedidos-acougue.html
